services:
  postgres:
    image: postgres:17
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-backend:
    build:
      context: ./auth-backend
    container_name: auth-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USERNAME: authuser
      DB_PASSWORD: authpassword
      JWT_SECRET: change-this-production-secret-to-a-random-strong-value
      JWT_EXPIRATION_SECONDS: 3600
      DDL_AUTO: update
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  auth-frontend:
    build:
      context: ./auth-frontend
    container_name: auth-frontend
    ports:
      - "8080:8080"
    depends_on:
      - auth-backend

volumes:
  postgres-data:
