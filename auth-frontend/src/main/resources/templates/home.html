<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="card"><h1>Authenticated</h1><p id="user"></p><pre id="profile"></pre><button id="logout">Logout</button></main>
<script>
const token=localStorage.getItem('accessToken');
if(!token) location='/login';
else {
 document.getElementById('user').textContent='Welcome, '+(localStorage.getItem('username')||'user');
 fetch('http://localhost:8081/api/user/profile',{headers:{Authorization:'Bearer '+token}})
 .then(async r=>{if(r.status===401||r.status===403){localStorage.clear();location='/login';return;}document.getElementById('profile').textContent=JSON.stringify(await r.json(),null,2);});
}
document.getElementById('logout').onclick=()=>{localStorage.clear();location='/login';};
</script></body></html>
