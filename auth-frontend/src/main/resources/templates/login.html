<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="card"><h1>Login</h1><form id="loginForm"><label>Username<input id="username" required></label><label>Password<input id="password" type="password" required></label><button>Login</button></form><p id="message"></p><a href="/register">Create an account</a></main>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const r=await fetch('http://localhost:8081/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});
 const msg=document.getElementById('message');
 if(!r.ok){msg.textContent='Invalid username or password.';return;}
 const d=await r.json(); localStorage.setItem('accessToken',d.accessToken); localStorage.setItem('username',d.username); localStorage.setItem('role',d.role); location='/home';
});
</script></body></html>
