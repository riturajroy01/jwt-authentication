server:
  port: 8081
spring:
  application:
    name: auth-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USERNAME:authuser}
    password: ${DB_PASSWORD:authpassword}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
management:
  endpoints:
    web:
      exposure:
        include: health,info
